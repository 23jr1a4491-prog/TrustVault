{% extends 'base.html' %}

{% block title %}Register Account — TrustVault{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2.5rem auto;">
    <div class="tv-card">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div class="tv-brand-icon" style="margin: 0 auto 0.75rem auto; width: 40px; height: 40px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff;">Create a TrustVault Account</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">Select your intended role and secure your credentials</p>
        </div>

        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="tv-form-group">
                <label class="tv-label">Account Role</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <label style="border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.75rem; display: flex; flex-direction: column; cursor: pointer; background: var(--bg-input);">
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span class="tv-badge tv-badge-owner">Owner</span>
                            <input type="radio" name="role" value="owner" checked style="accent-color: var(--emerald-500);">
                        </div>
                        <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;">
                            Upload, delete, and share documents with others
                        </span>
                    </label>

                    <label style="border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.75rem; display: flex; flex-direction: column; cursor: pointer; background: var(--bg-input);">
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span class="tv-badge tv-badge-viewer">Viewer</span>
                            <input type="radio" name="role" value="viewer" style="accent-color: var(--emerald-500);">
                        </div>
                        <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;">
                            Read-only access to files shared with you
                        </span>
                    </label>
                </div>
            </div>

            <div class="tv-form-group">
                <label class="tv-label">Username</label>
                <input type="text" name="username" class="tv-input" placeholder="e.g. alex_corp" value="{{ username or '' }}" required>
            </div>

            <div class="tv-form-group">
                <label class="tv-label">Corporate or Personal Email</label>
                <input type="email" name="email" class="tv-input" placeholder="alex@company.com" value="{{ email or '' }}" required>
            </div>

            <div class="tv-form-group">
                <label class="tv-label">Password</label>
                <input type="password" name="password" class="tv-input" placeholder="At least 6 characters" required>
            </div>

            <div class="tv-form-group">
                <label class="tv-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="tv-input" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="tv-btn tv-btn-emerald" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
                Complete Registration
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('main.login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
